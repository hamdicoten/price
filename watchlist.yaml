# Brew & Savour — watchlist
#
# Each item is one ingredient group. Brands inside a group are alternatives to each other;
# the daily digest shows the cheapest UNIT price (₱/kg, ₱/L) in each group.
#
# category: heading the item is shown under (panel filter chips + Telegram digest)
# brands:   product name must contain one of these. Leave EMPTY for unbranded items (fresh meat)
# keywords: product name must contain one of these (empty = every product of the brand)
# exclude:  product name must NOT contain any of these
# queries:  search terms for stores searched by keyword (WalterMart, Landmark)
#
# Keep `id` stable once prices are recorded — it links the price history.

settings:
  snr_member: true           # S&R account is a member; logged-in prices are member prices
  drop_threshold: 0.15       # alert when price is 15% below its 30-day median
  history_days: 30
  min_history_for_low: 7     # days of history needed before "lowest price" alerts
  min_low_gap: 0.05          # a new low must beat the previous low by at least 5%
  realert_days: 7            # do not repeat the same alert at the same price within 7 days
  waltermart_store_id: "7638"   # WalterMart Mabalacat (closest online branch to Capas)
  landmark_substore: mkt        # Landmark Makati
  # S&R: logging in (SNR_EMAIL / SNR_PASSWORD) shows prices in every category.
  # No address needed; fill this only if branch-specific prices are ever required.
  snr_address:
    company_name: ""
    building_no: ""
    street: ""
    barangay: ""
    city: ""

items:
  # Groups match by PRODUCT TYPE, not brand, so store brands (Member's Value) and other
  # alternatives show up next to the brands you buy today. The panel's search box finds a brand.

  # ---------------- Dairy ----------------
  - id: cheese
    name: Cheese
    category: Dairy
    brands: []
    keywords: [cheese, cheddar, quickmelt, cheezee, mozzarella, parmesan, keso, quezo, cheese whiz, pizza topping]
    exclude: [ice cream, cheesecake, cheese cake, chips, cracker, snack, ramen, noodle, curls, puffs,
              popcorn, bread, ensaymada, burger, hotdog, sausage, chicken, bites, mayo, sauce, quezon]
    queries: [eden cheese, magnolia cheese, cheddar cheese, mozzarella, cream cheese, parmesan]

  - id: cream
    name: Cream
    category: Dairy
    brands: []
    keywords: [all purpose cream, all-purpose cream, allpurpose, whipping cream, heavy cream, cooking cream,
               pasta cream, table cream, sour cream, thick cream, double cream]
    exclude: [ice cream, cream of mushroom, cream cheese, creamer, coffee-mate, coffeemate]
    queries: [all purpose cream, whipping cream, heavy cream, cooking cream]

  - id: butter
    name: Butter & Margarine
    category: Dairy
    brands: []
    keywords: [butter, margarine, dari creme, daricreme, spreadable]
    exclude: [peanut butter, peanut, buttermilk pancake, pancake, waffle, cookie, biscuit, popcorn, cracker,
              butterscotch, chicken, shrimp, sauce, bread, cake, candy, chips, body butter, shea, lotion]
    queries: [anchor butter, dari creme, butter, unsalted butter, margarine]

  - id: milk
    name: Milk
    category: Dairy
    brands: []
