               evaporated milk, evaporada, condensed milk, condensada, powdered milk, milk powder,
               barista, oat milk, almond milk, soya milk, soy milk, lactose free milk, oat beverage,
               almond non-dairy]
    exclude: [chocolate, strawberry, melon, banana, cocoa, milkshake, flavored, flavoured, cultured,
              tea, coffee, candy, biscuit, cookie]
    queries: [fresh milk, full cream milk, evaporated milk, condensed milk, oat milk, barista milk]

